server:
  port: 8080
spring:
  application:
    name: msd
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:msd_db}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${app.keycloak.server-url}/realms/${app.keycloak.realm}/protocol/openid-connect/certs

app:
  ai-service:
    url: http://localhost:8000/chat

  storage:
    upload-dir: ${APP_STORAGE_DIR:uploads}

  keycloak:
    server-url: ${APP_KEYCLOAK_SERVER_URL:https://authorization.prototypes.skylark.ma}
    admin:
      client-id: ${APP_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      username: ${APP_KEYCLOAK_ADMIN_USERNAME:kcadmin}
      password: "${APP_KEYCLOAK_ADMIN_PASSWORD:kcPassword!>?}"
    realm: ${APP_KEYCLOAK_REALM:msd}
    client-id: ${APP_KEYCLOAK_CLIENT_ID:msd-rest-api}
    client-secret: ${APP_KEYCLOAK_CLIENT_SECRET:cjcRxk4ZG7cyg3UXrL1t8aGEnCjWP0oX}
    test-user: ${APP_KEYCLOAK_TEST_USER:technicien@gmail.com}
    test-password: ${APP_KEYCLOAK_TEST_PASSWORD:123456@Aa}

logging:
  level:
    org.keycloak: DEBUG

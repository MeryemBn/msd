name: msd_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  flutter_native_splash: ^2.4.7
  intl: ^0.20.2
  uuid: ^4.5.3
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  permission_handler: ^12.0.1
  alarm: ^5.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  jwt_decoder: ^2.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  # OCR (Correction du nom du package)
  google_mlkit_text_recognition: ^0.13.0
  # Carte Google Maps
  google_maps_flutter: ^2.5.3
  http: ^1.2.2
  # For phone calls
  url_launcher: ^6.2.5
  # Firebase pour le suivi temps réel
  firebase_core: ^2.24.2
  firebase_database: ^10.3.7
  # Jitsi Meet SDK for teleconsultation
  jitsi_meet_flutter_sdk: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

# Configuration des icônes de l'application
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/shared/assets/images/logo_background.png"
  adaptive_icon_background: "lib/shared/assets/images/logo_background.png"
  adaptive_icon_foreground: "lib/shared/assets/images/logo_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "lib/shared/assets/images/logo_foreground.png"
  android_12:
    image: "lib/shared/assets/images/logo_foreground.png"
    icon_background_color: "#FFFFFF"
  android_gravity: center
  fullscreen: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/shared/assets/images/
    - assets/alarm_sound.mp3
    - assets/config/
